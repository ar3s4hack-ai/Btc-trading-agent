name: Agente Rango 9h (senales + Telegram)

on:
  workflow_dispatch: {}          # lanzable a mano desde la pestana Actions
  schedule:
    # De lunes a viernes, de 08:00 a 21:40 (hora de Espana en verano). Cada ejecucion
    # se queda en bucle revisando el mercado cada minuto durante ~5,5 h; si ya hay una
    # en marcha, la siguiente espera en cola, asi no quedan huecos.
    - cron: '7,27,47 6-19 * * 1-5'

permissions:
  contents: write

concurrency:
  group: rango9h
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Vigilar el rango 9-10 y enviar senales
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: '500'           # saldo inicial de la cartera simulada ($)
          POSITION_USD: '500'
          LEVERAGE: '20'          # solo para mostrar el margen en los mensajes
          RUN_MINUTES: '330'
          POLL_SEC: '60'
        run: node agent/rango9h.js
