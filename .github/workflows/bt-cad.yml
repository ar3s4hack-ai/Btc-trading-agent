name: bt-cad
on:
  push:
    branches: [bt-cad]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        q:
          - "mode=kz2&tf=5m&tag=K2-BTC&symbols=BTCUSDT&v=brkA:src=asia,win=lon,mode=brk,sl=mid,tp=2|brkA-t:src=asia,win=lon,mode=brk,sl=mid,tp=2,t=1|brkA-t-1R:src=asia,win=lon,mode=brk,sl=mid,tp=1,t=1|brkL:src=lon,win=nyam,mode=brk,sl=mid,tp=2|brkL-t:src=lon,win=nyam,mode=brk,sl=mid,tp=2,t=1|brkPD-t:src=pd,win=day,mode=brk,sl=atr,k=1,tp=2,t=1|revA-t:src=asia,win=lon,mode=rev,tp=2,t=1|revL-t:src=lon,win=nyam,mode=rev,tp=2,t=1|revPD-t:src=pd,win=day,mode=rev,tp=2,t=1"
          - "mode=kz2&tf=5m&tag=K2-ALT&symbols=HYPEUSDT,TAOUSDT,HBARUSDT,UNIUSDT,SUIUSDT,SOLUSDT,LINKUSDT&v=brkA:src=asia,win=lon,mode=brk,sl=mid,tp=2|brkA-t:src=asia,win=lon,mode=brk,sl=mid,tp=2,t=1|brkA-t-1R:src=asia,win=lon,mode=brk,sl=mid,tp=1,t=1|brkL:src=lon,win=nyam,mode=brk,sl=mid,tp=2|brkL-t:src=lon,win=nyam,mode=brk,sl=mid,tp=2,t=1|brkPD-t:src=pd,win=day,mode=brk,sl=atr,k=1,tp=2,t=1|revA-t:src=asia,win=lon,mode=rev,tp=2,t=1|revL-t:src=lon,win=nyam,mode=rev,tp=2,t=1|revPD-t:src=pd,win=day,mode=rev,tp=2,t=1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun bt/run.ts
        env:
          Q: ${{ matrix.q }}
