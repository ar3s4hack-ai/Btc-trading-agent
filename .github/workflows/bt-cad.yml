name: bt-cad
on:
  push:
    branches: [bt-cad]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        q:
          - "symbols=BTCUSDT&tzFix=1&fee=0.02&wkd=1&tEx=1&m7slP=600&m7tpP=800&ampMin=250&ampMax=600&adxMin=20&v=base:|ha:haF=1|zl:zlF=1|ds:dsF=1|b1:bbF=1|b2:bbF=2|se:seF=1|hazl:haF=1,zlF=1"
          - "symbols=HYPEUSDT,TAOUSDT,HBARUSDT,UNIUSDT,SUIUSDT,SOLUSDT,LINKUSDT&tzFix=1&fee=0.02&wkd=1&tEx=1&st1h=1&adxMin=20&adxH=1&v=base:|ha:haF=1|zl:zlF=1|ds:dsF=1|b1:bbF=1|b2:bbF=2|se:seF=1|hazl:haF=1,zlF=1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun bt/run.ts
        env:
          Q: ${{ matrix.q }}
