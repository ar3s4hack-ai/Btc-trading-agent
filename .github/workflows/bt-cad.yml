name: bt-cad
on:
  push:
    branches: [bt-cad]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        q:
          - "mode=kz&tf=5m&tag=KZ-BTC&symbols=BTCUSDT"
          - "mode=kz&tf=5m&tag=KZ-ALT&symbols=HYPEUSDT,TAOUSDT,HBARUSDT,UNIUSDT,SUIUSDT,SOLUSDT,LINKUSDT"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun bt/run.ts
        env:
          Q: ${{ matrix.q }}
