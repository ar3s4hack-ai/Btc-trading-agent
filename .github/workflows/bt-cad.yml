name: bt-cad
on:
  push:
    branches: [bt-cad]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        q:
          - "mode=coq&tf=5m&tag=COQ5&symbols=BTCUSDT,HYPEUSDT,TAOUSDT,HBARUSDT,UNIUSDT,SUIUSDT,SOLUSDT,LINKUSDT&v=checklist:v=0|chk+patron:v=1|triangulos:v=2 || mode=coq&tf=15m&htf1=60&htf2=240&tag=COQ15&symbols=BTCUSDT,HYPEUSDT,TAOUSDT,HBARUSDT,UNIUSDT,SUIUSDT,SOLUSDT,LINKUSDT&v=checklist:v=0|chk+patron:v=1|triangulos:v=2"
          - "tag=R5-BTC&tf=5m&symbols=BTCUSDT&tzFix=1&fee=0.02&wkd=1&tEx=1&m7slP=600&m7tpP=800&ampMin=250&ampMax=600&adxMin=20&v=base:|cqH:cq=1|cqHn:cq=2|cqB:cq=3|cqBn:cq=4|room1:cq=5,cqK=1|room05:cq=5,cqK=0.5|ema5m:cq=6"
          - "tag=R5-ALT&tf=5m&symbols=HYPEUSDT,TAOUSDT,HBARUSDT,UNIUSDT,SUIUSDT,SOLUSDT,LINKUSDT&tzFix=1&fee=0.02&wkd=1&tEx=1&st1h=1&adxMin=20&adxH=1&rgTP=1.125&v=base:|cqH:cq=1|cqHn:cq=2|cqB:cq=3|cqBn:cq=4|room1:cq=5,cqK=1|room05:cq=5,cqK=0.5|ema5m:cq=6"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun bt/run.ts
        env:
          Q: ${{ matrix.q }}
